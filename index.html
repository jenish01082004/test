<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access</title>
<style>
  :root{
    --bg: #12151a;
    --panel: #1a1e26;
    --line: #2a3038;
    --text: #eef1f5;
    --muted: #8891a0;
    --accent: #5eead4;
    --accent-dim: #2f6f65;
    --danger: #f97066;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(94,234,212,0.06), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(94,234,212,0.04), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:0.7;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  p.sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 26px;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
    font-family:var(--mono);
    letter-spacing:0.03em;
  }
  input[type="password"]{
    width:100%;
    background:#0f1216;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:15px;
    padding:13px 14px;
    border-radius:8px;
    outline:none;
    letter-spacing:0.08em;
    transition:border-color .15s ease;
  }
  input[type="password"]:focus{
    border-color:var(--accent);
  }
  .btn{
    width:100%;
    margin-top:18px;
    padding:13px 14px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#0b1512;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{ background:#7ff2df; }
  .btn:active{ transform:scale(0.98); }
  .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .error{
    color:var(--danger);
    font-size:13px;
    margin-top:12px;
    font-family:var(--mono);
    min-height:16px;
  }
  .content p{
    color:var(--muted);
    line-height:1.7;
    font-size:15px;
  }
  .footer-row{
    display:flex;
    gap:12px;
    margin-top:28px;
  }
  .btn-secondary{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
  }
  .btn-secondary:hover{ border-color:var(--accent); background:rgba(94,234,212,0.06); }
  .btn-yes{ flex:1; background:var(--accent); color:#0b1512; border:none; }
  .btn-no{ flex:1; background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-no:hover{ background:rgba(249,112,102,0.08); }
  .hidden{ display:none; }
  .badge{
    display:inline-block;
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent-dim);
    background:rgba(94,234,212,0.08);
    border:1px solid rgba(94,234,212,0.25);
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:16px;
  }
  .confirm-icon{
    font-size:32px;
    margin-bottom:8px;
  }
  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>
/* ============================================================
   CONFIGURATION — edit these before deploying
   ============================================================ */

// Passwords mapped to each user's display name.
// Change these two passwords before you deploy.
const USERS = {
  "change-me-1": "User One",
  "change-me-2": "User Two"
};

// Telegram bot used to notify the admin.
// 1. Message @BotFather on Telegram, send /newbot, copy the token it gives you.
// 2. Message your new bot once (anything), then visit:
//    https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates
//    and copy the "chat":{"id": ...} number — that's your CHAT_ID.
const TELEGRAM_BOT_TOKEN = "PASTE_YOUR_BOT_TOKEN_HERE";
const TELEGRAM_CHAT_ID   = "PASTE_YOUR_CHAT_ID_HERE";

/* ============================================================ */

let currentUser = null;

function sendTelegram(text){
  if (TELEGRAM_BOT_TOKEN.startsWith("PASTE_") || TELEGRAM_CHAT_ID.startsWith("PASTE_")) {
    console.warn("Telegram not configured — message not sent:", text);
    return;
  }
  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text })
  }).catch(err => console.error("Telegram send failed:", err));
}

function timestamp(){
  return new Date().toLocaleString();
}

function render(html){
  document.getElementById("app").innerHTML = html;
}

function renderLogin(errorMsg){
  render(`
    <p class="eyebrow">Restricted access</p>
    <h1>Enter password</h1>
    <p class="sub">This site is limited to two authorized users.</p>
    <form id="loginForm">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus />
      <button class="btn" type="submit">Unlock</button>
      <div class="error">${errorMsg || ""}</div>
    </form>
  `);
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const val = document.getElementById("pw").value;
    if (USERS[val]) {
      currentUser = USERS[val];
      sendTelegram(`🔓 ${currentUser} opened the website — ${timestamp()}`);
      renderPage1();
    } else {
      renderLogin("Incorrect password. Try again.");
    }
  });
}

function renderPage1(){
  render(`
    <p class="badge">Signed in as ${currentUser}</p>
    <h1>Page 1</h1>
    <div class="content">
      <p>Welcome. This is the first page of the flow. Replace this paragraph with whatever you want ${currentUser} to read before moving on.</p>
    </div>
    <button class="btn" id="nextBtn">Next</button>
  `);
  document.getElementById("nextBtn").addEventListener("click", renderPage2);
}

function renderPage2(){
  render(`
    <p class="badge">Signed in as ${currentUser}</p>
    <h1>Page 2</h1>
    <div class="content">
      <p>Replace this with the question or statement ${currentUser} needs to respond to.</p>
    </div>
    <div class="footer-row">
      <button class="btn-yes btn" id="yesBtn">Yes</button>
      <button class="btn-no btn" id="noBtn">No</button>
    </div>
  `);
  document.getElementById("yesBtn").addEventListener("click", () => respond("Yes"));
  document.getElementById("noBtn").addEventListener("click", () => respond("No"));
}

function respond(answer){
  sendTelegram(`${answer === "Yes" ? "✅" : "❌"} ${currentUser} answered: ${answer} — ${timestamp()}`);
  render(`
    <div class="confirm-icon">${answer === "Yes" ? "✅" : "❌"}</div>
    <h1>Response recorded</h1>
    <p class="sub">Thanks, ${currentUser}. Your answer (${answer}) has been sent.</p>
  `);
}

renderLogin();
</script>
</body>
</html>
